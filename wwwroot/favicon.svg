<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <!-- TalentScreen Electric Blue Brand Gradient -->
    <linearGradient id="tsBrandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <!-- Verified Screening Emerald Gradient -->
    <linearGradient id="tsBadgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Subtle Depth Filter -->
    <filter id="iconShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="0.8" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Base Rounded Squircle Tile -->
  <rect width="30" height="30" x="1" y="1" rx="7" fill="url(#tsBrandGrad)" />
  <rect width="30" height="30" x="1" y="1" rx="7" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="0.8" />

  <!-- Recruitment Briefcase / Dossier Glyph -->
  <g filter="url(#iconShadow)">
    <!-- Briefcase Handle -->
    <path d="M12 6 C12 5 13 4.2 14.2 4.2 L17.8 4.2 C19 4.2 20 5 20 6 L20 7.5 L12 7.5 Z" 
          fill="none" 
          stroke="#ffffff" 
          stroke-width="1.6" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- Briefcase Body -->
    <rect x="6.5" y="7.5" width="19" height="15" rx="2.5" fill="#ffffff" />
    
    <!-- Briefcase Mid Accent / Separation Line -->
    <line x1="6.5" y1="13" x2="25.5" y2="13" stroke="#2563eb" stroke-width="1.2" opacity="0.4" />
    
    <!-- Briefcase Center Clasp -->
    <rect x="14" y="11.8" width="4" height="2.5" rx="0.6" fill="#1e40af" />
  </g>

  <!-- Screening Verified Emerald Checkmark Badge -->
  <g transform="translate(18, 18)" filter="url(#iconShadow)">
    <circle cx="5.5" cy="5.5" r="5.5" fill="url(#tsBadgeGrad)" stroke="#ffffff" stroke-width="1.4" />
    <path d="M3.2 5.5 L4.8 7.2 L7.8 4" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
